/* ---------------- router ---------------- */
const app = $("#app");
function route() {
  const h = (location.hash || "#home").slice(1) || "home";
  let view, nav = h;
  if (h === "home") view = Home();
  else if (h === "projects") view = Projects();
  else if (h.startsWith("project-")) { view = Project(h.slice(8)); nav = "projects"; }
  else if (h === "experience") view = Experience();
  else if (h === "education") view = Education();
  else if (h === "writing") view = Writing();
  else if (h === "contact") view = Contact();
  else view = NotFound();
  app.innerHTML = `<div class="view">${view}</div>`;
  document.querySelectorAll(".links a").forEach(a => { if (a.dataset.r === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const titles = { home: "", projects: "Projects", experience: "Experience", education: "Education", writing: "Writing", contact: "Contact" };
  const pj = h.startsWith("project-") ? PROJECTS.find(p => p.id === h.slice(8)) : null;
  document.title = (pj ? pj.title + " — " : titles[h] ? titles[h] + " — " : "") + "Chinmay Paranjape — Senior Data Scientist";
  closeMenu();
  window.scrollTo(0, 0);
  wire();
}

function wire() {
  // tabs
  const tabs = app.querySelectorAll('[role="tab"]');
  tabs.forEach(t => t.addEventListener("click", () => {
    tabs.forEach(o => { o.setAttribute("aria-selected", o === t ? "true" : "false"); $("#" + o.getAttribute("aria-controls")).hidden = o !== t; });
  }));
  // resume
  app.querySelectorAll("[data-resume]").forEach(b => b.addEventListener("click", downloadResume));
  // copy email
  app.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(PROFILE.email); b.textContent = "Copied"; }
    catch (e) { b.textContent = "Select the address to copy"; }
    setTimeout(() => (b.textContent = "Copy email"), 2200);
  }));
  // contact
  app.querySelectorAll("[data-contact]").forEach(f => f.addEventListener("submit", e => {
    e.preventDefault();
    const st = f.querySelector("[data-status]");
    const d = Object.fromEntries(new FormData(f));
    if (!d.name.trim() || !d.message.trim() || !/^\S+@\S+\.\S+$/.test(d.email)) { st.textContent = "Please add your name, a valid email and a message."; return; }
    const subject = encodeURIComponent("Hello from " + d.name.trim());
    const body = encodeURIComponent(d.message.trim() + "\n\n— " + d.name.trim() + " (" + d.email.trim() + ")");
    const href = `mailto:${PROFILE.email}?subject=${subject}&body=${body}`;
    const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
    st.innerHTML = `Your email app should open with this message drafted. If it doesn't, write to <strong style="color:var(--fg)">${esc(PROFILE.email)}</strong>.`;
  }));
}

/* résumé download via the platform's downloads capability, with a fallback link */
let downloadsApi;
async function getDownloads() {
  if (downloadsApi !== undefined) return downloadsApi;
  try { downloadsApi = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { downloadsApi = null; }
  return downloadsApi;
}
async function downloadResume(ev) {
  const holder = ev.currentTarget.parentElement.parentElement;
  const st = holder.querySelector("[data-resume-status]") || app.querySelector("[data-resume-status]");
  const say = h => { if (st) st.innerHTML = h; };
  const fallback = `If the download doesn't start, <a class="textlink" href="${esc(PROFILE.resume)}" target="_blank" rel="noopener">open the résumé PDF</a>.`;
  say("Preparing résumé…");
  try {
    const api = await getDownloads();
    if (!api) {
      const a = document.createElement("a");
      a.href = PROFILE.resume; a.download = "Chinmay_Paranjape_Resume.pdf";
      document.body.appendChild(a); a.click(); a.remove();
      say("");
      return;
    }
    const res = await fetch(PROFILE.resume);
    if (!res.ok) throw new Error("fetch");
    const blob = await res.blob();
    await api.save({ filename: "Chinmay_Paranjape_Resume.pdf", data: blob });
    say("Résumé saved.");
  } catch (e) {
    if (e && e.code === "declined") say("Download cancelled.");
    else say(fallback);
  }
}

/* theme */
const root = document.documentElement, themeBtn = $("#theme");
function setTheme(t) {
  root.dataset.theme = t;
  themeBtn.innerHTML = t === "dark" ? sun : moon;
  themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
  try { localStorage.setItem("cp-theme", t); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("cp-theme"); } catch (e) {}
setTheme(saved || "dark");
themeBtn.addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark"));

/* mobile menu */
const menuBtn = $("#menu"), links = $("#links");
function closeMenu() { links.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); menuBtn.setAttribute("aria-label", "Open menu"); }
menuBtn.addEventListener("click", () => {
  const open = !links.classList.contains("open");
  links.classList.toggle("open", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
});

window.addEventListener("hashchange", route);
route();
</script>
